<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset = "UTF-8">
    <title>GUIDÆTA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="stylesheet.css">
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6"></script>
    </head>
<body>

<div class = "sidebar">
    <h4 class = "mb-4">GUIDÆTA Explorer</h4>
    
    <div class = "card mb-4 shadow-sm">
        <div class = "card-body">
            <h6 class = "card-title small fw-bold text-muted text-uppercase mb-3">Filter Settings</h6>
            
            <div class = "section-label fw-bold mb-2 text-primary text-uppercase">Basic Filter</div>
            
            <label class = "x-small">Age</label>
            <div class = "row g-2 mb-2">
                <div class = "col-6">
                    <input type = "number" id = "filter-age-min" class = "form-control form-control-sm" placeholder = "Min" min = "0">
                </div>
                <div class="col-6">
                    <input type = "number" id = "filter-age-max" class = "form-control form-control-sm" placeholder = "Max" min = "0">
                </div>
            </div>
            
            <div class="mb-2">
                <label class = "x-small">Gender</label>
                <select id = "filter-gender" class = "form-select form-select-sm">
                    <option value = "">All Genders</option><option value = "m">Male</option>
                    <option value = "f">Female</option><option value = "d">Diverse</option>
                </select>
            </div>

            <div class = "mb-2">
            <label class ="x-small">Education Level</label>
            <select id = "filter-edu-min" class = "form-select form-select-sm mb-1">
                <option value = "">Min. Education (All)</option><option value = "compulsoryschool">Compulsory School</option>
                <option value = "apprenticeship">Apprenticeship</option><option value = "highschool">Highschool</option>
                <option value = "university">University</option>
            </select>
            <select id = "filter-edu-max" class = "form-select form-select-sm">
                <option value = "">Max. Education (All)</option><option value = "compulsoryschool">Compulsory School</option>
                <option value = "apprenticeship">Apprenticeship</option><option value = "highschool">Highschool</option>
                <option value = "university">University</option>
            </select>
            </div>

            <label class = "x-small">Total Duration(sek.)</label>
            <div class = "row g-2 mb-2">
                <div class = "col-6">
                    <input type = "number" id = "filter-total-duration-min" class = "form-control form-control-sm" placeholder = "Min" min = "0">
                </div>
                <div class = "col-6">
                    <input type = "number" id = "filter-total-duration-max" class = "form-control form-control-sm" placeholder = "Max" min = "0">
                </div>
            </div>

            <div class = "row g-2 mb-3">
                <div class = "col-6">
                    <label class = "x-small">Handedness</label>
                    <select id = "filter-hand" class = "form-select form-select-sm">
                        <option value = "">All</option><option value = "right">Right</option>
                        <option value = "left">Left</option><option value = "both">Both</option>
                    </select>
                </div>
                <div class = "col-6">
                    <label class = "x-small">Amblyopia</label>
                    <select id = "filter-amblyopia" class = "form-select form-select-sm">
                        <option value = "">All</option><option value = "yes">No</option>
                    </select>
                </div>
            </div>

            <div class = "accordion accordion-flush" id = "filterAccordion">
                <div class = "accordion-item">
                    <h2 class = "accordion-header">
                        <button class = "accordion-button collapsed fw-bold text-primary" type = "button" data-bs-toggle = "collapse" data-bs-target = "#advancedCollapse" style = "box-shadow: none">
                            ADVANCED FILTER
                        </button>
                    </h2>
                    <div id = "advancedCollapse" class = "accordion-collapse collapse">
                        <div class = "accordion-body p-0 pt-3">

                            <label class = "x-small">Avg. Intrinsic Cognitive Load (ICL)</label>
                            <div class = "row g-2 mb-2">
                                <div class = "col-6">
                                    <input type = "number" step = "0.1" id = "filter-icl-min" class = "form-control form-control-sm" placeholder = "Min" min = "0">
                                </div>
                                <div class = "col-6">
                                    <input type = "number" step = "0.1" id = "filter-icl-max" class = "form-control form-control-sm" placeholder = "Max" min = "0">
                                </div>
                            </div>

                            <label class = "x-small">Avg. Extraneous Cognitive Load (ECL)</label>
                            <div class = "row g-2 mb-2">
                                <div class = "col-6">
                                    <input type = "number" step = "0.1" id = "filter-ecl-min" class = "form-control form-control-sm" placeholder = "Min" min = "0">
                                </div>
                                <div class = "col-6">
                                    <input type = "number" step = "0.1" id = "filter-ecl-max" class = "form-control form-control-sm" placeholder = "Max" min = "0">
                                </div>
                            </div>
                            
                            <label class = "x-small">Avg. Total Cognitive Load (CL)</label>
                            <div class = "row g-2 mb-2">
                                <div class = "col-6">
                                    <input type = "number" step = "0.1" id = "filter-cl-min" class = "form-control form-control-sm" placeholder = "Min" min = "0">
                                </div>
                                <div class = "col-6">
                                    <input type = "number" step = "0.1" id = "filter-cl-max" class = "form-control form-control-sm" placeholder = "Max" min = "0">
                                </div>
                            </div>

                            <label class = "x-small">Avg. Diabetes Knowledge (DKT2 score) (%)</label>
                            <div class = "row g-2 mb-2">
                                <div class = "col-6">
                                    <input type = "number" id = "filter-dkt-min" class="form-control form-control-sm" placeholder = "Min" min = "0">
                                </div>
                                <div class="col-6">
                                    <input type = "number" id = "filter-dkt-max" class="form-control form-control-sm" placeholder = "Max" min = "0">
                                </div>
                            </div>

                            <label class = "x-small">Total Clicks</label>
                            <div class = "row g-2 mb-2">
                                <div class = "col-6">
                                    <input type = "number" id = "filter-total-clicks-min" class = "form-control form-control-sm" placeholder = "Min" min = "0">
                                </div>
                                <div class = "col-6">
                                    <input type = "number" id = "filter-total-clicks-max" class = "form-control form-control-sm" placeholder = "Max" min = "0">
                                </div>
                            </div>

                            <label class = "x-small">Total Scrolls</label>
                            <div class = "row g-2 mb-2">
                                <div class = "col-6">
                                    <input type = "number" id = "filter-total-scrolls-min" class = "form-control form-control-sm" placeholder = "Min" min = "0">
                                </div>
                                <div class = "col-6">
                                    <input type = "number" id = "filter-total-scrolls-max" class = "form-control form-control-sm" placeholder = "Max" min = "0">
                                </div>
                            </div>

                            <label class = "x-small">Total Mouse Moves</label>
                            <div class = "row g-2 mb-2">
                                <div class = "col-6">
                                    <input type = "number" id = "filter-total-mouse-moves-min" class = "form-control form-control-sm" placeholder = "Min" min = "0">
                                </div>
                                <div class = "col-6">
                                    <input type = "number" id = "filter-total-mouse-moves-max" class = "form-control form-control-sm" placeholder = "Max" min = "0">
                                </div>
                            </div>

                            <label class = "x-small">Total Keypresses</label>
                            <div class = "row g-2 mb-2">
                                <div class = "col-6">
                                    <input type = "number" id = "filter-total-keypresses-min" class = "form-control form-control-sm" placeholder = "Min" min = "0">
                                </div>
                                <div class = "col-6">
                                    <input type = "number" id = "filter-total-keypresses-max" class = "form-control form-control-sm" placeholder = "Max" min = "0">
                                </div>
                            </div>

                            <label class = "x-small">Total Events</label>
                            <div class = "row g-2 mb-2">
                                <div class = "col-6">
                                    <input type = "number" id = "filter-total-activity-min" class = "form-control form-control-sm" placeholder = "Min" min = "0">
                                </div>
                                <div class = "col-6">
                                    <input type = "number" id = "filter-total-activity-max" class = "form-control form-control-sm" placeholder = "Max" min = "0">
                                </div>
                            </div>

                            <label class = "x-small">Total Sessions</label>
                            <div class = "row g-2 mb-2">
                                <div class = "col-6">
                                    <input type = "number" id = "filter-total-sessions-min" class = "form-control form-control-sm" placeholder = "Min" min = "0">
                                </div>
                                <div class = "col-6">
                                    <input type = "number" id = "filter-total-sessions-max" class = "form-control form-control-sm" placeholder = "Max" min = "0">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <button class = "btn btn-sm btn-outline-danger w-100 mt-3" onclick = "reset_filters()">Reset All Filter</button>
        </div>
    </div>
    <div id = "user-count" class = "text-muted small fw-bold mb-2" style = "font-weight: 600">
    </div>
    <div id = "id-list">
        <div class = "text-center p-3 text-muted small">
            <div class = "spinner-border spinner-border-sm mb-2" role = "status"></div><br>
            Loading Dataset...
        </div>
    </div>
</div>

<main class = "main-content">
    <div id = "detail-view" class = "d-none">
        <div class = "d-flex justify-content-between align-items-center mb-4">
            <h2 id = "u-title" class = "display-6" style = "font-weight: 400">User Details</h2>
        </div>

        <div class = "row g-3">
            <div class = "col-md-8">
                <div class = "viz-container mb-3 overflow-auto">
                    <div class = "row g-0">
                        <div class = "col-4">
                            <h5 class = "mb-3" style = "font-weight: 600"><i class = "bi bi-graph-up-arrow"></i>Demographics</h5>
                            <div id = "u-details-demo"></div>
                        </div>
                            <div class = "col-8 ps-4">
                                <h5 class = "mb-3 text-center" style = "font-weight: 600">
                                    <i class ="bi bi-graph-up-arrow me-2"></i>Task Summary
                                </h5>
                                <div id = "summary-grid-container">
                                    <div id = "u-details-summary-table-1"></div>
                                    <div id = "u-details-summary-table-2"></div>
                                    <div id = "u-details-summary-table-3"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class = "row">    
            <div class = "col-md-12">
                <div class = "viz-container">
                    <h5 style = "font-weight: 600;">Individual Task Performance</h5>
                    <div class = "table-responsive">
                        <table class = "table table-hover mt-3">
                            <thead class = "table-light">
                                <tr><th class=  "text-center">Tasks</th><th class = "text-center">Status</th>
                                    <th class = "text-center">Duration</th><th class = "text-center">Ses.</th>
                                    <th class = "text-center">Clicks</th><th class = "text-center">Scrolls</th>
                                    <th class = "text-center">M-moves</th><th class = "text-center">Keypr.</th>
                                    <th class = "text-center">Events</th><th class = "text-center">ICL</th>
                                    <th class = "text-center">ECL</th><th class = "text-center">Avg. CL</th>
                                </tr>
                            </thead>
                            <tbody id = "task-tbody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<script src = "utils.js"></script>
<script src = "filters.js"></script>
<script src = "stream.js"></script>
<script src = "main.js"></script>
</body>
</html>
